services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=genesis_attendance_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    volumes:
      - .:/app
      - ../.cursor:/.workspace_cursor
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Same Firebase creds as celery (needed for threaded FCM fallback)
      - ${FIREBASE_CREDENTIALS_DIR}:/firebase:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG_LOG_PATH=/.workspace_cursor/debug.log
      - FIREBASE_CREDENTIALS_PATH=/firebase/genesis-employee-firebase-adminsdk-fbsvc-9d7542afc2.json

  celery:
    build: .
    command: celery -A config worker -l info
    restart: unless-stopped
    volumes:
      - .:/app
      # Mount Firebase credentials for duty reminder FCM (set FIREBASE_CREDENTIALS_DIR in .env)
      - ${FIREBASE_CREDENTIALS_DIR}:/firebase:ro
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FIREBASE_CREDENTIALS_PATH=/firebase/genesis-employee-firebase-adminsdk-fbsvc-9d7542afc2.json

  celery-beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    volumes:
      - .:/app
      - ${FIREBASE_CREDENTIALS_DIR}:/firebase:ro
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FIREBASE_CREDENTIALS_PATH=/firebase/genesis-employee-firebase-adminsdk-fbsvc-9d7542afc2.json

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
