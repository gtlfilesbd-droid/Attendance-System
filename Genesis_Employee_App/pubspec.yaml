name: genesis_employee_app
description: Genesis Employee Attendance Tracking Mobile Application
publish_to: 'none'
version: 3.0.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Location tracking
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  permission_handler: ^11.0.1

  # Background service
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.0
  workmanager: ^0.9.0
  timezone: ^0.9.2

  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  connectivity_plus: ^6.0.5

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.8.3
  device_info_plus: ^10.1.2

  # UI
  intl: ^0.18.1

  # Utils
  battery_plus: ^5.0.2

  # Firebase (FCM for duty reminder push when app is closed)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Additional helpful packages
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.4
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "Genesis.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/genesis_icon_foreground.png"
  adaptive_icon_foreground_inset: 32
